services:

  db:
    image: mariadb:11
    container_name: lager-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      # Wird NUR beim ersten Start (leeres Volume) ausgeführt:
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [lager]

  web:
    build: ./docker/php
    container_name: lager-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    volumes:
      # Bind-Mount: Änderungen an PHP-Dateien wirken ohne Rebuild.
      - ./src:/var/www/html
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks: [lager]
    # --- Traefik statt Port-Mapping? Dann oben "ports" auskommentieren,
    # --- das Traefik-Netz ergänzen und diese Labels aktivieren:
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.lager.rule=Host(`lager.intern.example`)"
    #   - "traefik.http.routers.lager.entrypoints=websecure"
    #   - "traefik.http.routers.lager.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.lager.loadbalancer.server.port=80"

  # Optional – nur zum Reinschauen in die DB. Für den Dauerbetrieb
  # auskommentieren, das ist eine ungeschützte DB-Oberfläche.
  adminer:
    image: adminer:latest
    container_name: lager-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [lager]

volumes:
  db_data:

networks:
  lager:
